name: Android Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT"
            exit 1
          fi
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Cache Robolectric Android runtime
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented
          key: robolectric-android-all-14-10818077-i6

      - name: Prefetch Robolectric Android runtime
        run: |
          set -euo pipefail
          DIR="$HOME/.m2/repository/org/robolectric/android-all-instrumented/14-robolectric-10818077-i6"
          JAR="$DIR/android-all-instrumented-14-robolectric-10818077-i6.jar"
          mkdir -p "$DIR"
          if [ ! -s "$JAR" ]; then
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 \
              -o "$JAR" \
              https://repo1.maven.org/maven2/org/robolectric/android-all-instrumented/14-robolectric-10818077-i6/android-all-instrumented-14-robolectric-10818077-i6.jar
          fi
          ls -lh "$JAR"

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug and release APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Show build outputs
        run: |
          ls -lh app/build/outputs/apk/debug/*.apk
          ls -lh app/build/outputs/apk/release/*.apk

      - name: Upload panel screenshots
        uses: actions/upload-artifact@v4
        with:
          name: panel-screenshots
          path: app/build/screenshots/*.png
          if-no-files-found: ignore

      - name: Upload installable APKs
        uses: actions/upload-artifact@v4
        with:
          name: monarch-d-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish the CI-built release APK to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAPT="${ANDROID_HOME}/build-tools/35.0.0/aapt"
          APKSIGNER="${ANDROID_HOME}/build-tools/35.0.0/apksigner"

          "$APKSIGNER" verify --verbose "$APK"
          VERSION=$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='[^']*' versionCode='[^']*' versionName='\([^']*\)'.*$/\1/p" | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "Could not read versionName from $APK" >&2
            exit 1
          fi
          echo "Publishing release APK version $VERSION"

          mkdir -p apk
          rm -f apk/MonarchD-*.apk apk/MonarchD-*.apk.sha256
          cp "$APK" "apk/MonarchD-${VERSION}.apk"
          (cd apk && sha256sum "MonarchD-${VERSION}.apk" > "MonarchD-${VERSION}.apk.sha256")
          sha256sum "apk/MonarchD-${VERSION}.apk"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A apk
          if git diff --cached --quiet; then
            echo "Published APK and checksum unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "chore: publish Monarch D ${VERSION} APK [skip ci]"
          git push origin HEAD:main

      - name: Upload published APK checksum
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: published-apk-checksum
          path: apk/MonarchD-*.apk.sha256
          if-no-files-found: error

      - name: Attach APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
