name: Publish APK to main

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for the committed APK (for example 1.0.0)'
        required: true
        default: '1.0.2'

permissions:
  contents: write

jobs:
  publish:
    name: Build and commit APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT"
            exit 1
          fi
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build signed release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Commit APK to main
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p apk
          cp app/build/outputs/apk/release/app-release.apk "apk/MonarchD-${VERSION}.apk"
          sha256sum "apk/MonarchD-${VERSION}.apk" | tee "apk/MonarchD-${VERSION}.apk.sha256"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk
          if git diff --cached --quiet; then
            echo "APK unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "chore: publish Monarch D ${VERSION} APK [skip ci]"
          git push origin HEAD:main
