name: Publish APK to main

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for the committed APK (for example 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  publish:
    name: Build and commit APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build signed release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Commit APK to main
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p apk
          cp app/build/outputs/apk/release/app-release.apk "apk/MonarchD-${VERSION}.apk"
          sha256sum "apk/MonarchD-${VERSION}.apk" | tee "apk/MonarchD-${VERSION}.apk.sha256"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk
          if git diff --cached --quiet; then
            echo "APK unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "chore: publish Monarch D ${VERSION} APK [skip ci]"
          git push origin HEAD:main
